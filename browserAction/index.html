<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      html { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      body { min-width: 280px; padding: 12px; margin: 0; }
      #empty { color: #666; font-size: 13px; }
      .label { display: block; font-size: 12px; font-weight: 600; color: #444; margin: 8px 0 4px; }
      .select, .input {
        width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px;
        font-size: 13px; box-sizing: border-box;
      }
      .select:focus, .input:focus { outline: none; border-color: #2563eb; }
      .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
      .tag {
        display: inline-flex; align-items: center; gap: 4px;
        padding: 4px 8px; border-radius: 9999px; font-size: 12px;
        background: #eef2ff; color: #3730a3; border: none; cursor: default;
      }
      .tag-close { cursor: pointer; font-weight: 700; }
      .actions { display: flex; gap: 8px; margin-top: 12px; }
      .btn {
        flex: 1; padding: 8px; border: none; border-radius: 4px; font-size: 13px; cursor: pointer;
      }
      .btn-primary { background: #2563eb; color: #fff; }
      .btn-primary:hover { background: #1d4ed8; }
      .btn-secondary { background: #e5e7eb; color: #374151; }
      .btn-secondary:hover { background: #d1d5db; }
    </style>
  </head>
  <body>
    <div id="root">
      <p id="empty">No expense detected yet.<br>Visit LunchMoney to trigger auto-detection.</p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
